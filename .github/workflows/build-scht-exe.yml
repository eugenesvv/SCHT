name: Build SCHT Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.6.0
  push:
    tags:
      - "v*"

jobs:
  build-windows-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean SCHT.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "sc_hauling_tracker.py" -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $versionLine) { throw "APP_VERSION was not found" }
          $version = $versionLine.Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" "installer\SCHT.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify release files
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "sc_hauling_tracker.py" -Pattern '^APP_VERSION = "([^"]+)"$'
          $version = $versionLine.Matches[0].Groups[1].Value
          if (-not (Test-Path "dist/SCHT.exe")) { throw "dist/SCHT.exe was not produced" }
          if (-not (Test-Path "dist/SCHT-Setup-$version.exe")) { throw "dist/SCHT-Setup-$version.exe was not produced" }

          $files = @("dist/SCHT-Setup-$version.exe", "dist/SCHT.exe")
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $checksums | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: SCHT-windows-release
          path: |
            dist/SCHT.exe
            dist/SCHT-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $versionLine = Select-String -Path "sc_hauling_tracker.py" -Pattern '^APP_VERSION = "([^"]+)"$'
          $version = $versionLine.Matches[0].Groups[1].Value
          $tag = $env:RELEASE_TAG
          if ($tag -ne "v$version") { throw "Tag $tag does not match APP_VERSION $version" }

          gh release create $tag `
            "dist/SCHT-Setup-$version.exe" `
            "dist/SCHT.exe" `
            "dist/SHA256SUMS.txt" `
            --verify-tag `
            --title "SCHT $version" `
            --notes-file "PATCH_NOTES.txt"
