name: Build SCHT Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows-release:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean SCHT.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "sc_hauling_tracker.py" -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $versionLine) { throw "APP_VERSION was not found" }
          $version = $versionLine.Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" "installer\SCHT.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify release files
        shell: pwsh
        run: |
          $versionLine = Select-String -Path "sc_hauling_tracker.py" -Pattern '^APP_VERSION = "([^"]+)"$'
          $version = $versionLine.Matches[0].Groups[1].Value
          if (-not (Test-Path "dist/SCHT.exe")) { throw "dist/SCHT.exe was not produced" }
          if (-not (Test-Path "dist/SCHT-Setup-$version.exe")) { throw "dist/SCHT-Setup-$version.exe was not produced" }

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: SCHT-windows-release
          path: |
            dist/SCHT.exe
            dist/SCHT-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
