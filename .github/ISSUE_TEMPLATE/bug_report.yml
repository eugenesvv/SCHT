name: Bug report
description: Report a reproducible SCHT problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach unredacted Game.log files, AppData, OCR reports, or screenshots containing player or desktop information.
  - type: input
    id: version
    attributes:
      label: SCHT version
      placeholder: 1.5.66
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation type
      options:
        - Windows installer
        - Portable executable
        - Python source
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open SCHT
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Sanitized supporting information
      description: Paste only the smallest redacted log excerpt or screenshot needed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed player names, account identifiers, personal paths, credentials, and unrelated desktop content.
          required: true
